
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bagora Admin Panel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="admin-body">

<div class="admin-container">

    <header class="admin-header">
        <h1>BAGORA <span>ADMIN</span></h1>
        <a href="index.html" class="back-btn">View Website</a>
    </header>

    <section class="admin-box" id="loginBox">
        <h2>Admin Login</h2>
        <p>Enter your admin password to continue.</p>

        <input type="password" id="adminPassword"
               placeholder="Enter password">

        <button class="main-btn" onclick="adminLogin()">
            LOGIN
        </button>

        <p id="loginMessage" class="message"></p>
    </section>

    <div id="adminDashboard" style="display:none;">

        <section class="admin-box">
            <h2>Add New Product</h2>

            <form id="productForm">

                <label>Product Name</label>
                <input type="text" id="productName"
                       placeholder="Enter product name" required>

                <label>Product Price (Rs.)</label>
                <input type="number" id="productPrice"
                       placeholder="Enter price" min="1" required>

                <label>Product Image</label>
                <input type="file" id="productImage"
                       accept="image/*" required>

                <label>Product Description</label>
                <textarea id="productDescription"
                          placeholder="Enter product description"></textarea>

                <button type="submit" class="main-btn">
                    UPLOAD PRODUCT
                </button>
            </form>

            <p id="uploadMessage" class="message"></p>
        </section>

        <section class="admin-box">
            <h2>Manage Products</h2>
            <div id="adminProductList"></div>
        </section>

        <button class="logout-btn" onclick="adminLogout()">
            LOGOUT
        </button>

    </div>

</div>

<script src="script.js"></script>
</body>
</html>
