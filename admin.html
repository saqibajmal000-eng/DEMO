
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bagora Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="admin-page">

<div class="admin-container">

    <header class="admin-header">
        <h1>BAGORA ADMIN</h1>
        <a href="index.html" class="back-button">Visit Website</a>
    </header>

    <section class="admin-box" id="loginBox">
        <h2>Admin Login</h2>

        <form id="loginForm">
            <input type="password" id="adminPassword"
                   placeholder="Enter Password" required>

            <button type="submit" class="btn">Login</button>
        </form>

        <p id="loginMessage"></p>
    </section>

    <div id="adminDashboard" hidden>

        <section class="admin-box">
            <h2>Upload New Product</h2>

            <form id="productForm">

                <label for="productName">Product Name</label>
                <input type="text" id="productName" required>

                <label for="productPrice">Price (Rs.)</label>
                <input type="number" id="productPrice" min="1" required>

                <label for="productDescription">Description</label>
                <textarea id="productDescription"></textarea>

                <label for="productImage">Product Image</label>
                <input type="file" id="productImage" accept="image/*" required>

                <button type="submit" class="btn">Add Product</button>
            </form>

            <p id="uploadMessage"></p>
        </section>

        <section class="admin-box">
            <h2>My Products</h2>
            <div id="adminProductList"></div>
        </section>

        <button type="button" id="logoutButton" class="logout-button">
            Logout
        </button>

    </div>

</div>

<script src="script.js"></script>
</body>
</html>
