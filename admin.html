<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bagora Admin</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f2ee;
    color: #332820;
}

/* LOGIN */

.login-page {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.login-box {
    width: 100%;
    max-width: 400px;
    background: white;
    padding: 40px;
    box-shadow: 0 5px 30px rgba(0,0,0,0.08);
}

.login-box h1 {
    text-align: center;
    color: #4b3528;
    margin-bottom: 10px;
    letter-spacing: 3px;
}

.login-box p {
    text-align: center;
    color: #888;
    margin-bottom: 30px;
}

.login-box label {
    display: block;
    margin: 15px 0 8px;
    font-weight: bold;
    font-size: 14px;
}

.login-box input {
    width: 100%;
    padding: 14px;
    border: 1px solid #ddd;
}

.login-box button {
    width: 100%;
    padding: 15px;
    margin-top: 25px;
    background: #4b3528;
    color: white;
    border: none;
    cursor: pointer;
}

.login-box button:hover {
    background: #b68a65;
}

#errorMessage {
    color: red;
    margin-top: 15px;
    display: none;
}

/* DASHBOARD */

.dashboard {
    display: none;
}

.topbar {
    background: #4b3528;
    color: white;
    padding: 20px 5%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
}

.topbar h1 {
    letter-spacing: 2px;
}

.topbar button {
    padding: 11px 20px;
    border: none;
    background: white;
    color: #4b3528;
    cursor: pointer;
    font-weight: bold;
}

.container {
    padding: 35px 5%;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-bottom: 35px;
}

.stat-card {
    background: white;
    padding: 25px;
    border: 1px solid #eee;
}

.stat-card p {
    color: #777;
    margin-bottom: 10px;
}

.stat-card h2 {
    color: #4b3528;
    font-size: 30px;
}

.section-title {
    margin: 30px 0 20px;
}

/* ORDER CARDS */

.orders-list {
    display: grid;
    gap: 20px;
}

.order-card {
    background: white;
    padding: 25px;
    border: 1px solid #eee;
    border-left: 5px solid #b68a65;
}

.order-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

.order-top h3 {
    color: #4b3528;
}

.order-details {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.order-details div {
    background: #faf8f5;
    padding: 12px;
}

.order-details small {
    display: block;
    color: #777;
    margin-bottom: 5px;
}

.order-details strong {
    overflow-wrap: anywhere;
}

.order-total {
    font-size: 21px;
    color: #8a5b39;
    font-weight: bold;
    margin-top: 20px;
}

.order-actions {
    margin-top: 20px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.order-actions select {
    padding: 12px;
    border: 1px solid #ddd;
}

.delete-btn {
    padding: 12px 20px;
    background: #b83232;
    color: white;
    border: none;
    cursor: pointer;
}

.empty-orders {
    background: white;
    text-align: center;
    padding: 50px;
    color: #777;
}

.status {
    padding: 7px 12px;
    background: #f0e5d8;
    color: #4b3528;
    font-size: 12px;
    font-weight: bold;
}

@media(max-width: 700px) {

    .stats {
        grid-template-columns: 1fr;
    }

    .order-details {
        grid-template-columns: 1fr;
    }

    .container {
        padding: 20px 4%;
    }

    .order-card {
        padding: 18px;
    }

}

</style>
</head>

<body>

<!-- LOGIN PAGE -->

<div class="login-page" id="loginPage">

    <div class="login-box">

        <h1>BAGORA</h1>
        <p>Admin Dashboard Login</p>

        <form id="loginForm">

            <label>Username</label>
            <input type="text" id="username" required>

            <label>Password</label>
            <input type="password" id="password" required>

            <button type="submit">LOGIN</button>

            <div id="errorMessage">
                Incorrect username or password.
            </div>

        </form>

    </div>

</div>

<!-- DASHBOARD -->

<div class="dashboard" id="dashboard">

    <header class="topbar">

        <h1>BAGORA ADMIN</h1>

        <button onclick="logout()">LOGOUT</button>

    </header>

    <div class="container">

        <!-- STATISTICS -->

        <div class="stats">

            <div class="stat-card">
                <p>Total Products</p>
                <h2 id="totalProducts">0</h2>
            </div>

            <div class="stat-card">
                <p>Total Orders</p>
                <h2 id="totalOrders">0</h2>
            </div>

            <div class="stat-card">
                <p>New Orders</p>
                <h2 id="newOrders">0</h2>
            </div>

        </div>

        <!-- ORDERS -->

        <h2 class="section-title">Customer Orders</h2>

        <div class="orders-list" id="ordersList"></div>

    </div>

</div>

<script>

/* ADMIN LOGIN */

const ADMIN_USERNAME = "admin";
const ADMIN_PASSWORD = "Bagora123";

const loginPage = document.getElementById("loginPage");
const dashboard = document.getElementById("dashboard");

function safe(value) {
    return String(value ?? "").replace(/[&<>"']/g, function(c) {
        return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        }[c];
    });
}

function checkLogin() {

    if (sessionStorage.getItem("bagoraAdminLoggedIn") === "yes") {
        showDashboard();
    }

}

document.getElementById("loginForm").addEventListener("submit", function(e) {

    e.preventDefault();

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    if (username === ADMIN_USERNAME && password === ADMIN_PASSWORD) {

        sessionStorage.setItem("bagoraAdminLoggedIn", "yes");

        document.getElementById("errorMessage").style.display = "none";

        showDashboard();

    } else {

        document.getElementById("errorMessage").style.display = "block";

    }

});

function showDashboard() {

    loginPage.style.display = "none";
    dashboard.style.display = "block";

    loadDashboard();

}

/* LOGOUT */

function logout() {

    sessionStorage.removeItem("bagoraAdminLoggedIn");

    dashboard.style.display = "none";
    loginPage.style.display = "flex";

}

/* GET DATA */

function getProducts() {
    return JSON.parse(localStorage.getItem("bagoraProducts") || "[]");
}

function getOrders() {
    return JSON.parse(localStorage.getItem("bagoraOrders") || "[]");
}

/* DASHBOARD */

function loadDashboard() {

    const products = getProducts();
    const orders = getOrders();

    document.getElementById("totalProducts").textContent = products.length;
    document.getElementById("totalOrders").textContent = orders.length;

    const newCount = orders.filter(function(order) {
        return order.status === "New";
    }).length;

    document.getElementById("newOrders").textContent = newCount;

    displayOrders(orders);

}

/* SHOW ORDERS */

function displayOrders(orders) {

    const list = document.getElementById("ordersList");

    if (orders.length === 0) {

        list.innerHTML = `
            <div class="empty-orders">
                <h3>No Orders Yet</h3>
                <p>Customer orders will appear here.</p>
            </div>
        `;

        return;

    }

    list.innerHTML = "";

    orders.forEach(function(order, index) {

        const card = document.createElement("div");
        card.className = "order-card";

        card.innerHTML = `
            <div class="order-top">
                <h3>Order #${index + 1}</h3>
                <span class="status">${safe(order.status || "New")}</span>
            </div>

            <div class="order-details">

                <div>
                    <small>Customer Name</small>
                    <strong>${safe(order.customerName)}</strong>
                </div>

                <div>
                    <small>WhatsApp Number</small>
                    <strong>${safe(order.customerPhone)}</strong>
                </div>

                <div>
                    <small>Product Name</small>
                    <strong>${safe(order.productName)}</strong>
                </div>

                <div>
                    <small>Product Price</small>
                    <strong>Rs. ${Number(order.productPrice).toLocaleString()}</strong>
                </div>

                <div>
                    <small>Quantity</small>
                    <strong>${Number(order.quantity)}</strong>
                </div>

                <div>
                    <small>Delivery Charges</small>
                    <strong>Rs. ${Number(order.delivery).toLocaleString()}</strong>
                </div>

                <div>
                    <small>Order Date</small>
            <strong>${safe(order.date)}</strong>
                </div>

            </div>

            <div class="order-total">
                Total: Rs. ${Number(order.total).toLocaleString()}
            </div>

            <div class="order-actions">

                <select class="status-select">
                    <option value="New">New</option>
                    <option value="Confirmed">Confirmed</option>
                    <option value="Shipped">Shipped</option>
                    <option value="Delivered">Delivered</option>
                    <option value="Cancelled">Cancelled</option>
                </select>

                <button class="delete-btn">DELETE ORDER</button>

            </div>
        `;

        const select = card.querySelector(".status-select");

        select.value = order.status || "New";

        select.addEventListener("change", function() {

            updateOrderStatus(order.id, this.value);

        });

        card.querySelector(".delete-btn").addEventListener("click", function() {

            deleteOrder(order.id);

        });

        list.appendChild(card);

    });

}

/* UPDATE STATUS */

function updateOrderStatus(orderId, newStatus) {

    const orders = getOrders();

    const order = orders.find(function(item) {
        return item.id === orderId;
    });

    if (order) {

        order.status = newStatus;

        localStorage.setItem("bagoraOrders", JSON.stringify(orders));

        loadDashboard();

    }

}

/* DELETE ORDER */

function deleteOrder(orderId) {

    if (!confirm("Are you sure you want to delete this order?")) {
        return;
    }

    const orders = getOrders().filter(function(order) {
        return order.id !== orderId;
    });

    localStorage.setItem("bagoraOrders", JSON.stringify(orders));

    loadDashboard();

}

/* START */

checkLogin();

</script>

</body>
</html>
